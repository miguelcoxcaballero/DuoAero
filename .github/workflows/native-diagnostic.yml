name: Original runtime diagnostic
on:
  push:
    branches: [codex/original-runtime-integration, codex/integration-137, codex/static-mascot-moods, codex/duoaero-2, codex/notation-sqrt, codex/lesson-migration, codex/sections-2-research]
    paths: ['native-base/**', '.github/workflows/native-diagnostic.yml']
  workflow_dispatch:
    inputs:
      scenarios:
        description: JSON array of device scenarios
        required: true
        default: '["path","lesson","formula","mixed","standalone","resume","mistakes","updater","review","accounts","google","night-large"]'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios || (github.ref_name == 'codex/sections-2-research' && '["two-sections"]' || (github.ref_name == 'codex/lesson-migration' && '["accounts","atmosphere-timing","chests-native","formula-words-touch"]' || (github.ref_name == 'codex/notation-sqrt' && '["sqrt-mixed"]' || (github.ref_name == 'codex/duoaero-2' && '["accounts","static-poses-only","formula-words-touch","atmosphere-hint","atmosphere-timing","isa-mixed","chests-native"]' || (github.ref_name == 'codex/static-mascot-moods' && '["static-mascot","updater","chests-native"]' || (github.ref_name == 'codex/integration-137' && '["formula-words-touch","updater","chests-native","atmosphere-hint","accounts"]' || '["s24","google","lesson","accounts","formula","chests","atmosphere"]'))))))) }}
    timeout-minutes: 60
    env:
      DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select disk-backed build directories
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/duoaero-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/duoaero-android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/duoaero-android/avd" >> "$GITHUB_ENV"
          echo "DUOAERO_APK=$RUNNER_TEMP/duoaero-handoff/Duolingo_v6.103.5.apk" >> "$GITHUB_ENV"
          echo "DUOAERO_DECODED=$RUNNER_TEMP/duoaero-decoded" >> "$GITHUB_ENV"
          echo "DUOAERO_SMALI=$RUNNER_TEMP/duoaero-decoded" >> "$GITHUB_ENV"
          echo "DUOAERO_APKTOOL=/tmp/apktool.jar" >> "$GITHUB_ENV"
          echo "DUOAERO_WORK=$RUNNER_TEMP/duoaero-native-base" >> "$GITHUB_ENV"
          echo "DUOAERO_EVIDENCE=$RUNNER_TEMP/duoaero-evidence" >> "$GITHUB_ENV"
      - name: Prepare original APK and local diagnostic signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Kotlin 2.0's bundled IntelliJ parser predates Java 25. Use the
          # runner's supported JDK for both the canonical updater and DEX tools.
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # This job installs its own pinned SDK. Remove only the
          # duplicate hosted-runner Android SDK to leave room for the emulator.
          # Keep task files on disk: some runners mount /tmp as a 7.7 GB tmpfs.
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ] && [ -d /usr/local/lib/android/sdk ]; then
            sudo rm -rf /usr/local/lib/android/sdk
          fi
          df -h "$RUNNER_TEMP"
          mkdir -p ${{ runner.temp }}/duoaero-handoff build ${{ runner.temp }}/duoaero-evidence
          gh release download handoff-2026-10-31-native-runtime-1 --repo "$GITHUB_REPOSITORY" --dir ${{ runner.temp }}/duoaero-handoff
          python - <<'PY'
          import json, hashlib, pathlib, zipfile
          for a in json.load(open('native-base/handoff-artifacts.json'))['artifacts']:
              p=pathlib.Path('${{ runner.temp }}/duoaero-handoff')/a['name']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256'], p.name
          with zipfile.ZipFile('${{ runner.temp }}/duoaero-handoff/DuoAero-handoff-fixtures.zip') as z:
              for name in z.namelist():
                  if name.startswith('native-base/tests/fixtures/'):
                      z.extract(name,'.')
          PY
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o "$DUOAERO_APKTOOL"
          java -jar "$DUOAERO_APKTOOL" d "$DUOAERO_APK" -o "$DUOAERO_SMALI"
          python -m pip install fonttools==4.61.1 Pillow==11.3.0
          if [ "$DIAGNOSTIC_SCENARIO" = static-poses-only ]; then python -m pip install imageio-ffmpeg==0.6.0; fi
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr
          fi
          keytool -genkeypair -keystore build/debug.p12 -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -dname 'CN=DuoAero CI Diagnostic' -keyalg RSA -validity 365
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Retry one transient download failure using the same SDK packages.
          # Only the temporary directory belonging to this attempt is removed.
          for attempt in 1 2; do
            sdk_tmp="$RUNNER_TEMP/duoaero-sdk-download-$attempt"
            mkdir -p "$sdk_tmp"
            if TMPDIR="$sdk_tmp" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64' && test -x "$ANDROID_HOME/emulator/emulator" && test -f "$ANDROID_HOME/system-images/android-36/google_apis/x86_64/source.properties"; then
              rm -rf "$sdk_tmp"
              break
            fi
            rm -rf "$sdk_tmp"
            if [ "$attempt" = 2 ]; then exit 1; fi
            echo 'SDK installation failed; retrying once with the same packages.' >&2
          done
      - name: Build diagnostic APKs, preserving original runtime
        run: |
          python native-base/test_session_ids.py
          python native-base/test_branding_text.py
          python native-base/test_icon_layout.py
          python native-base/test_mascot_animation.py
          python native-base/test_static_moods.py
          python native-base/course_adapter.py
          case "$DIAGNOSTIC_SCENARIO" in linus-static|standalone|s24|atmosphere|atmosphere-hint|atmosphere-offset-hint|atmosphere-timing|availability-timing|energy-info|chests|chests-native|sections|two-sections|extended-section|second-journey|aircraft-extra|rotor-extra|section-tail|resume|mistakes|updater|review|google) export DUOAERO_STANDALONE=1;; esac
          if [ "$DIAGNOSTIC_SCENARIO" = google ]; then export DUOAERO_GOOGLE_GATE=1; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = wind-mixed* ]]; then export DUOAERO_WIND_DIAGNOSTIC=1; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = column-wrong || "$DIAGNOSTIC_SCENARIO" = column-mixed ]]; then export DUOAERO_COLUMN_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = formula-words-touch ]; then export DUOAERO_WORD_TOUCH_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = hydraulic-words ]; then export DUOAERO_HYDRAULIC_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = isa-mixed ]; then export DUOAERO_ISA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = isa-extra ]; then export DUOAERO_ISA_EXTRA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = dynamic-mixed ]; then export DUOAERO_DYNAMIC_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = lapse-mixed ]; then export DUOAERO_LAPSE_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = sqrt-mixed ]; then export DUOAERO_SQRT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = isa-exp ]; then export DUOAERO_ISA_EXP_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = named-three ]; then export DUOAERO_NAMED_THREE_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = named-thrust ]; then export DUOAERO_NAMED_THRUST_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = power-slot ]; then export DUOAERO_POWER_SLOT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = named-isa ]; then export DUOAERO_NAMED_ISA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = cabin-steps ]; then export DUOAERO_CABIN_STEPS_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = aspect-slot ]; then export DUOAERO_ASPECT_SLOT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = product-fraction ]; then export DUOAERO_PRODUCT_FRACTION_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = direct-hint ]; then export DUOAERO_DIRECT_HINT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = lift-words ]; then export DUOAERO_LIFT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = total-thrust ]; then export DUOAERO_TOTAL_THRUST_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = mean-chord ]; then export DUOAERO_MEAN_CHORD_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = wind-extra ]; then export DUOAERO_WIND_EXTRA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = kinetic-steps ]; then export DUOAERO_KINETIC_STEPS_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = kinetic-formula ]; then export DUOAERO_KINETIC_FORMULA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = breguet-formula ]; then export DUOAERO_BREGUET_FORMULA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = induced-formula ]; then export DUOAERO_INDUCED_FORMULA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = structural-formula ]; then export DUOAERO_STRUCTURAL_FORMULA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = range-formula ]; then export DUOAERO_RANGE_FORMULA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = negative-exponent ]; then export DUOAERO_NEGATIVE_EXPONENT_DIAGNOSTIC=1; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = rocket-draft || "$DIAGNOSTIC_SCENARIO" = rocket-hint ]]; then export DUOAERO_ROCKET_DRAFT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = orbit-draft ]; then export DUOAERO_ORBIT_DRAFT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = buckling-notation ]; then export DUOAERO_BUCKLING_NOTATION_DIAGNOSTIC=1; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = payload-steps || "$DIAGNOSTIC_SCENARIO" = payload-hint ]]; then export DUOAERO_PAYLOAD_STEPS_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = reynolds-steps ]; then export DUOAERO_REYNOLDS_STEPS_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = approach-mixed ]; then export DUOAERO_APPROACH_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = spacecraft-mixed ]; then export DUOAERO_SPACECRAFT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = rotor-mixed ]; then export DUOAERO_ROTOR_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = missile-mixed ]; then export DUOAERO_MISSILE_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = temp-lift-mixed ]; then export DUOAERO_TEMP_LIFT_DIAGNOSTIC=1; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = two-sections || "$DIAGNOSTIC_SCENARIO" = section-tail ]]; then export DUOAERO_TWO_SECTION_DIAGNOSTIC=1; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = extended-section || "$DIAGNOSTIC_SCENARIO" = aircraft-extra || "$DIAGNOSTIC_SCENARIO" = rotor-extra ]]; then export DUOAERO_EXTENDED_SECTION_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = scientific-notation ]; then export DUOAERO_SCIENTIFIC_NOTATION_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = environment-systems ]; then export DUOAERO_SPACE_ENV_SYSTEMS_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = spacecraft-typology ]; then export DUOAERO_SPACECRAFT_TYPOLOGY_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = tsfc-conversion ]; then export DUOAERO_TSFC_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = jet-range-draft ]; then export DUOAERO_JET_RANGE_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = taper-domain ]; then export DUOAERO_TAPER_DOMAIN_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = wing-intro ]; then export DUOAERO_WING_DIAGNOSTIC=intro; fi
          if [ "$DIAGNOSTIC_SCENARIO" = wing-rest ]; then export DUOAERO_WING_DIAGNOSTIC=rest; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = extended-section || "$DIAGNOSTIC_SCENARIO" = second-journey ]]; then export DUOAERO_RELEASED_SECOND_DIAGNOSTIC=1; fi
          python research/test_tsfc_conversion_draft.py
          python research/test_taper_domain.py
          python research/test_spacecraft_typology.py
          python research/test_space_environment_systems.py
          python native-base/test_slot_probe_guard.py
          python native-base/test_tsfc_prerequisites.py
          python native-base/test_scientific_notation.py
          python tests/validate_bank.py
          python native-base/build.py
          python native-base/test_symbolic_grading.py
          python native-base/test_wind_steps.py
          python native-base/test_formula_words.py
          python native-base/test_feedback_checks.py
          python native-base/test_feedback_visual.py
          python native-base/test_isothermal_formula.py
          python native-base/test_rich_question.py
          python native-base/test_intro_formulas.py
          python native-base/test_path_structure.py
          python native-base/test_lesson_migrations.py
          python native-base/test_second_release_plan.py
          python native-base/test_lapse_steps.py
          python native-base/test_isa_offset.py
          python native-base/test_course_progress.py
          python native-base/test_tsfc_history.py
          python native-base/test_rewards.py
          python native-base/test_integrity.py | tee ${{ runner.temp }}/duoaero-evidence/integrity.txt
          python native-base/test_models.py --build-only
      - name: Observe original session dependencies
        timeout-minutes: 40
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name DuoAeroDiagnostic --path "$ANDROID_AVD_HOME/DuoAeroDiagnostic.avd" --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          emulator_memory=()
          if [[ "$DIAGNOSTIC_SCENARIO" = second-journey ]]; then emulator_memory=(-memory 3072); fi
          "$ANDROID_HOME/emulator/emulator" -avd DuoAeroDiagnostic "${emulator_memory[@]}" -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -accel on > $RUNNER_TEMP/duoaero-evidence/emulator.txt 2>&1 &
          emulator_pid=$!
          ready=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat $RUNNER_TEMP/duoaero-evidence/emulator.txt; exit 1; fi
            if [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat $RUNNER_TEMP/duoaero-evidence/emulator.txt; exit 1; fi
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 3600000
          adb shell input keyevent KEYCODE_WAKEUP
          if [[ "$DIAGNOSTIC_SCENARIO" = column-wrong || "$DIAGNOSTIC_SCENARIO" = column-mixed || "$DIAGNOSTIC_SCENARIO" = linus-static || "$DIAGNOSTIC_SCENARIO" = s24 || "$DIAGNOSTIC_SCENARIO" = branding-welcome || "$DIAGNOSTIC_SCENARIO" = atmosphere || "$DIAGNOSTIC_SCENARIO" = atmosphere-hint || "$DIAGNOSTIC_SCENARIO" = atmosphere-offset-hint || "$DIAGNOSTIC_SCENARIO" = atmosphere-timing || "$DIAGNOSTIC_SCENARIO" = energy-info || "$DIAGNOSTIC_SCENARIO" = google || "$DIAGNOSTIC_SCENARIO" = gap-s24 || "$DIAGNOSTIC_SCENARIO" = formula-words-touch || "$DIAGNOSTIC_SCENARIO" = hydraulic-words || "$DIAGNOSTIC_SCENARIO" = isa-mixed || "$DIAGNOSTIC_SCENARIO" = isa-extra || "$DIAGNOSTIC_SCENARIO" = lapse-mixed || "$DIAGNOSTIC_SCENARIO" = dynamic-mixed || "$DIAGNOSTIC_SCENARIO" = spacecraft-mixed || "$DIAGNOSTIC_SCENARIO" = missile-mixed || "$DIAGNOSTIC_SCENARIO" = wing-intro || "$DIAGNOSTIC_SCENARIO" = wing-rest || "$DIAGNOSTIC_SCENARIO" = temp-lift-mixed || "$DIAGNOSTIC_SCENARIO" = rotor-mixed || "$DIAGNOSTIC_SCENARIO" = approach-mixed || "$DIAGNOSTIC_SCENARIO" = sqrt-mixed || "$DIAGNOSTIC_SCENARIO" = isa-exp || "$DIAGNOSTIC_SCENARIO" = named-three || "$DIAGNOSTIC_SCENARIO" = named-thrust || "$DIAGNOSTIC_SCENARIO" = power-slot || "$DIAGNOSTIC_SCENARIO" = named-isa || "$DIAGNOSTIC_SCENARIO" = cabin-steps || "$DIAGNOSTIC_SCENARIO" = aspect-slot || "$DIAGNOSTIC_SCENARIO" = product-fraction || "$DIAGNOSTIC_SCENARIO" = direct-hint || "$DIAGNOSTIC_SCENARIO" = lift-words || "$DIAGNOSTIC_SCENARIO" = total-thrust || "$DIAGNOSTIC_SCENARIO" = mean-chord || "$DIAGNOSTIC_SCENARIO" = wind-extra || "$DIAGNOSTIC_SCENARIO" = kinetic-steps || "$DIAGNOSTIC_SCENARIO" = kinetic-formula || "$DIAGNOSTIC_SCENARIO" = breguet-formula || "$DIAGNOSTIC_SCENARIO" = induced-formula || "$DIAGNOSTIC_SCENARIO" = structural-formula || "$DIAGNOSTIC_SCENARIO" = range-formula || "$DIAGNOSTIC_SCENARIO" = negative-exponent || "$DIAGNOSTIC_SCENARIO" = rocket-draft || "$DIAGNOSTIC_SCENARIO" = rocket-hint || "$DIAGNOSTIC_SCENARIO" = orbit-draft || "$DIAGNOSTIC_SCENARIO" = buckling-notation || "$DIAGNOSTIC_SCENARIO" = availability-timing || "$DIAGNOSTIC_SCENARIO" = payload-steps || "$DIAGNOSTIC_SCENARIO" = payload-hint || "$DIAGNOSTIC_SCENARIO" = reynolds-steps ]]; then
            adb shell wm size 1440x3120
            adb shell wm density 560
          fi
          if [[ "$DIAGNOSTIC_SCENARIO" = column-wrong || "$DIAGNOSTIC_SCENARIO" = column-mixed || "$DIAGNOSTIC_SCENARIO" = linus-static || "$DIAGNOSTIC_SCENARIO" = gap-s24 || "$DIAGNOSTIC_SCENARIO" = formula-words-touch || "$DIAGNOSTIC_SCENARIO" = hydraulic-words || "$DIAGNOSTIC_SCENARIO" = isa-mixed || "$DIAGNOSTIC_SCENARIO" = isa-extra || "$DIAGNOSTIC_SCENARIO" = lapse-mixed || "$DIAGNOSTIC_SCENARIO" = dynamic-mixed || "$DIAGNOSTIC_SCENARIO" = spacecraft-mixed || "$DIAGNOSTIC_SCENARIO" = missile-mixed || "$DIAGNOSTIC_SCENARIO" = wing-intro || "$DIAGNOSTIC_SCENARIO" = wing-rest || "$DIAGNOSTIC_SCENARIO" = temp-lift-mixed || "$DIAGNOSTIC_SCENARIO" = rotor-mixed || "$DIAGNOSTIC_SCENARIO" = approach-mixed || "$DIAGNOSTIC_SCENARIO" = sqrt-mixed || "$DIAGNOSTIC_SCENARIO" = isa-exp || "$DIAGNOSTIC_SCENARIO" = named-three || "$DIAGNOSTIC_SCENARIO" = named-thrust || "$DIAGNOSTIC_SCENARIO" = power-slot || "$DIAGNOSTIC_SCENARIO" = named-isa || "$DIAGNOSTIC_SCENARIO" = cabin-steps || "$DIAGNOSTIC_SCENARIO" = aspect-slot || "$DIAGNOSTIC_SCENARIO" = product-fraction || "$DIAGNOSTIC_SCENARIO" = direct-hint || "$DIAGNOSTIC_SCENARIO" = lift-words || "$DIAGNOSTIC_SCENARIO" = total-thrust || "$DIAGNOSTIC_SCENARIO" = mean-chord || "$DIAGNOSTIC_SCENARIO" = wind-extra || "$DIAGNOSTIC_SCENARIO" = kinetic-steps || "$DIAGNOSTIC_SCENARIO" = kinetic-formula || "$DIAGNOSTIC_SCENARIO" = breguet-formula || "$DIAGNOSTIC_SCENARIO" = induced-formula || "$DIAGNOSTIC_SCENARIO" = structural-formula || "$DIAGNOSTIC_SCENARIO" = range-formula || "$DIAGNOSTIC_SCENARIO" = negative-exponent || "$DIAGNOSTIC_SCENARIO" = rocket-draft || "$DIAGNOSTIC_SCENARIO" = rocket-hint || "$DIAGNOSTIC_SCENARIO" = orbit-draft || "$DIAGNOSTIC_SCENARIO" = buckling-notation || "$DIAGNOSTIC_SCENARIO" = availability-timing || "$DIAGNOSTIC_SCENARIO" = payload-steps || "$DIAGNOSTIC_SCENARIO" = payload-hint || "$DIAGNOSTIC_SCENARIO" = reynolds-steps ]]; then
            adb shell cmd uimode night yes
            adb shell settings put system font_scale 1.15
          fi
          if [[ "$DIAGNOSTIC_SCENARIO" = taper-domain || "$DIAGNOSTIC_SCENARIO" = jet-range-draft || "$DIAGNOSTIC_SCENARIO" = tsfc-conversion || "$DIAGNOSTIC_SCENARIO" = spacecraft-typology || "$DIAGNOSTIC_SCENARIO" = scientific-notation || "$DIAGNOSTIC_SCENARIO" = environment-systems ]]; then
            adb shell wm size 1440x3120
            adb shell wm density 560
            adb shell settings put system font_scale 1.15
          fi
          timeout 360 adb install --no-incremental -r "$DUOAERO_WORK/DuoAero-native-base-test.apk"
          timeout 360 adb install --no-incremental -r "$DUOAERO_WORK/tests-signed.apk"
          timeout 180 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.ModelProbe > $RUNNER_TEMP/duoaero-evidence/models.txt
          adb logcat -d -b crash > $RUNNER_TEMP/duoaero-evidence/models-crash.txt
          adb logcat -d -s AndroidRuntime:E DEBUG:F libc:F ActivityManager:I > $RUNNER_TEMP/duoaero-evidence/models-lifecycle.txt
          run_probe() {
            probe_label="$1"
            probe_course="$2"
            probe_experiments="$3"
            probe_bootstrap="${4:-late}"
            probe_course_cache="${5:-none}"
            probe_lesson="${6:-math}"
            probe_interact="${7:-none}"
            probe_home="${8:-false}"
            probe_config="${9:-none}"
            probe_profile="${10:-diagnostic-flows}"
            probe_service="${11:-false}"
            probe_original_unmarked="${12:-false}"
            probe_timeout=180
            if [[ "$probe_interact" = math-all || "$probe_interact" = path-first ]]; then probe_timeout=300; fi
            if [[ "$probe_interact" = mixed* ]]; then probe_timeout=420; fi
            if [ "$probe_interact" = formula ]; then probe_timeout=600; fi
            if [ "$probe_interact" = second-journey ]; then probe_timeout=1800; fi
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/session-diagnostic.png /sdcard/Android/data/com.duoaero.nativebase/files/session-view-tree.json
