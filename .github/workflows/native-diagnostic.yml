      - name: Preserve emulator ANR thread traces
        if: always()
        timeout-minutes: 2
        run: |
          if command -v adb >/dev/null && adb get-state >/dev/null 2>&1; then
            adb logcat -d -b all > "${{ runner.temp }}/duoaero-evidence/device-log.txt"
            adb root || true
            timeout 20 adb wait-for-device || true
            adb pull /data/anr "${{ runner.temp }}/duoaero-evidence/anr-traces" || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-runtime-diagnostic-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/duoaero-evidence/
            ${{ runner.temp }}/duoaero-native-base/*-test.apk
            ${{ runner.temp }}/duoaero-native-base/tests-signed.apk
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-runtime-evidence-${{ matrix.scenario }}
          path: ${{ runner.temp }}/duoaero-evidence/
          retention-days: 7
