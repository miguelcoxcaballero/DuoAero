name: Original runtime diagnostic
on:
  push:
    branches: [codex/original-runtime-integration, codex/integration-137, codex/static-mascot-moods, codex/duoaero-2, codex/sections-2-research]
    paths: ['native-base/**', '.github/workflows/native-diagnostic.yml']
  workflow_dispatch:
    inputs:
      scenarios:
        description: JSON array of device scenarios
        required: true
        default: '["path","lesson","formula","mixed","standalone","resume","mistakes","updater","review","accounts","google","night-large"]'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios || (github.ref_name == 'codex/sections-2-research' && '["two-sections"]' || (github.ref_name == 'codex/duoaero-2' && '["accounts","static-poses-only","formula-words-touch","atmosphere-hint","atmosphere-timing","isa-mixed"]' || (github.ref_name == 'codex/static-mascot-moods' && '["static-mascot","updater","chests-native"]' || (github.ref_name == 'codex/integration-137' && '["formula-words-touch","updater","chests-native","atmosphere-hint","accounts"]' || '["s24","google","lesson","accounts","formula","chests","atmosphere"]'))))) }}
    timeout-minutes: 30
    env:
      DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select disk-backed build directories
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/duoaero-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/duoaero-android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/duoaero-android/avd" >> "$GITHUB_ENV"
          echo "DUOAERO_APK=$RUNNER_TEMP/duoaero-handoff/Duolingo_v6.103.5.apk" >> "$GITHUB_ENV"
          echo "DUOAERO_DECODED=$RUNNER_TEMP/duoaero-decoded" >> "$GITHUB_ENV"
          echo "DUOAERO_SMALI=$RUNNER_TEMP/duoaero-decoded" >> "$GITHUB_ENV"
          echo "DUOAERO_APKTOOL=/tmp/apktool.jar" >> "$GITHUB_ENV"
          echo "DUOAERO_WORK=$RUNNER_TEMP/duoaero-native-base" >> "$GITHUB_ENV"
          echo "DUOAERO_EVIDENCE=$RUNNER_TEMP/duoaero-evidence" >> "$GITHUB_ENV"
      - name: Prepare original APK and local diagnostic signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Kotlin 2.0's bundled IntelliJ parser predates Java 25. Use the
          # runner's supported JDK for both the canonical updater and DEX tools.
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # This job installs its own pinned SDK. Remove only the
          # duplicate hosted-runner Android SDK to leave room for the emulator.
          # Keep task files on disk: some runners mount /tmp as a 7.7 GB tmpfs.
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ] && [ -d /usr/local/lib/android/sdk ]; then
            sudo rm -rf /usr/local/lib/android/sdk
          fi
          df -h "$RUNNER_TEMP"
          mkdir -p ${{ runner.temp }}/duoaero-handoff build ${{ runner.temp }}/duoaero-evidence
          gh release download handoff-2026-10-31-native-runtime-1 --repo "$GITHUB_REPOSITORY" --dir ${{ runner.temp }}/duoaero-handoff
          python - <<'PY'
          import json, hashlib, pathlib, zipfile
          for a in json.load(open('native-base/handoff-artifacts.json'))['artifacts']:
              p=pathlib.Path('${{ runner.temp }}/duoaero-handoff')/a['name']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256'], p.name
          with zipfile.ZipFile('${{ runner.temp }}/duoaero-handoff/DuoAero-handoff-fixtures.zip') as z:
              for name in z.namelist():
                  if name.startswith('native-base/tests/fixtures/'):
                      z.extract(name,'.')
          PY
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o "$DUOAERO_APKTOOL"
          java -jar "$DUOAERO_APKTOOL" d "$DUOAERO_APK" -o "$DUOAERO_SMALI"
          python -m pip install fonttools==4.61.1 Pillow==11.3.0
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr
          fi
          keytool -genkeypair -keystore build/debug.p12 -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -dname 'CN=DuoAero CI Diagnostic' -keyalg RSA -validity 365
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools'  'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
      - name: Build diagnostic APKs, preserving original runtime
        run: |
          python native-base/test_session_ids.py
          python native-base/test_branding_text.py
          python native-base/test_icon_layout.py
          python native-base/test_mascot_animation.py
          python native-base/test_static_moods.py
          python native-base/course_adapter.py
          case "$DIAGNOSTIC_SCENARIO" in standalone|s24|atmosphere|atmosphere-hint|atmosphere-timing|chests|chests-native|sections|two-sections|resume|mistakes|updater|review|google) export DUOAERO_STANDALONE=1;; esac
          if [ "$DIAGNOSTIC_SCENARIO" = google ]; then export DUOAERO_GOOGLE_GATE=1; fi
          if [[ "$DIAGNOSTIC_SCENARIO" = wind-mixed* ]]; then export DUOAERO_WIND_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = formula-words-touch ]; then export DUOAERO_WORD_TOUCH_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = isa-mixed ]; then export DUOAERO_ISA_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = spacecraft-mixed ]; then export DUOAERO_SPACECRAFT_DIAGNOSTIC=1; fi
          if [ "$DIAGNOSTIC_SCENARIO" = two-sections ]; then export DUOAERO_TWO_SECTION_DIAGNOSTIC=1; fi
          python native-base/build.py
          python native-base/test_symbolic_grading.py
          python native-base/test_wind_steps.py
          python native-base/test_formula_words.py
          python native-base/test_isothermal_formula.py
          python native-base/test_intro_formulas.py
          python native-base/test_path_structure.py
          python native-base/test_course_progress.py
          python native-base/test_rewards.py
          python native-base/test_integrity.py | tee ${{ runner.temp }}/duoaero-evidence/integrity.txt
          python native-base/test_models.py --build-only
      - name: Observe original session dependencies
        timeout-minutes: 16
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name DuoAeroDiagnostic --path "$ANDROID_AVD_HOME/DuoAeroDiagnostic.avd" --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd DuoAeroDiagnostic -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -accel on > ${{ runner.temp }}/duoaero-evidence/emulator.txt 2>&1 &
          emulator_pid=$!
          ready=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat ${{ runner.temp }}/duoaero-evidence/emulator.txt; exit 1; fi
            if [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat ${{ runner.temp }}/duoaero-evidence/emulator.txt; exit 1; fi
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 3600000
          adb shell input keyevent KEYCODE_WAKEUP
          if [[ "$DIAGNOSTIC_SCENARIO" = s24 || "$DIAGNOSTIC_SCENARIO" = atmosphere || "$DIAGNOSTIC_SCENARIO" = atmosphere-hint || "$DIAGNOSTIC_SCENARIO" = atmosphere-timing || "$DIAGNOSTIC_SCENARIO" = google || "$DIAGNOSTIC_SCENARIO" = gap-s24 || "$DIAGNOSTIC_SCENARIO" = formula-words-touch || "$DIAGNOSTIC_SCENARIO" = isa-mixed || "$DIAGNOSTIC_SCENARIO" = spacecraft-mixed ]]; then
            adb shell wm size 1440x3120
            adb shell wm density 560
          fi
          if [[ "$DIAGNOSTIC_SCENARIO" = gap-s24 || "$DIAGNOSTIC_SCENARIO" = formula-words-touch || "$DIAGNOSTIC_SCENARIO" = isa-mixed || "$DIAGNOSTIC_SCENARIO" = spacecraft-mixed ]]; then
            adb shell cmd uimode night yes
            adb shell settings put system font_scale 1.15
          fi
          timeout 180 adb install --no-incremental -r "$DUOAERO_WORK/DuoAero-native-base-test.apk"
          timeout 180 adb install --no-incremental -r "$DUOAERO_WORK/tests-signed.apk"
          timeout 180 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.ModelProbe > ${{ runner.temp }}/duoaero-evidence/models.txt
          adb logcat -d -b crash > ${{ runner.temp }}/duoaero-evidence/models-crash.txt
          adb logcat -d -s AndroidRuntime:E DEBUG:F libc:F ActivityManager:I > ${{ runner.temp }}/duoaero-evidence/models-lifecycle.txt
          run_probe() {
            probe_label="$1"
            probe_course="$2"
            probe_experiments="$3"
            probe_bootstrap="${4:-late}"
            probe_course_cache="${5:-none}"
            probe_lesson="${6:-math}"
            probe_interact="${7:-none}"
            probe_home="${8:-false}"
            probe_config="${9:-none}"
            probe_profile="${10:-diagnostic-flows}"
            probe_service="${11:-false}"
            probe_timeout=180
            if [[ "$probe_interact" = math-all || "$probe_interact" = path-first ]]; then probe_timeout=300; fi
            if [[ "$probe_interact" = mixed* ]]; then probe_timeout=420; fi
            if [ "$probe_interact" = formula ]; then probe_timeout=600; fi
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/session-diagnostic.png /sdcard/Android/data/com.duoaero.nativebase/files/session-view-tree.json
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/interaction-*.png /sdcard/Android/data/com.duoaero.nativebase/files/interaction-*.json
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/home-diagnostic.png /sdcard/Android/data/com.duoaero.nativebase/files/home-view-tree.json /sdcard/Android/data/com.duoaero.nativebase/files/home-before-config.png /sdcard/Android/data/com.duoaero.nativebase/files/home-before-config.json
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/lesson-*.png /sdcard/Android/data/com.duoaero.nativebase/files/lesson-*.json
            probe_status=0
            timeout "$probe_timeout" adb shell am instrument -w -e course_id "$probe_course" -e experiments "$probe_experiments" -e bootstrap "$probe_bootstrap" -e course_cache "$probe_course_cache" -e lesson "$probe_lesson" -e interact "$probe_interact" -e capture_home "$probe_home" -e config_cache "$probe_config" -e profile_mode "$probe_profile" -e local_service "$probe_service" com.duoaero.nativebase.tests/com.duoaero.nativebase.UserSessionProbe > "${{ runner.temp }}/duoaero-evidence/session-$probe_label.txt" || probe_status=$?
            echo "Instrumentation command exit: $probe_status" >> "${{ runner.temp }}/duoaero-evidence/session-$probe_label.txt"
            adb pull /sdcard/Android/data/com.duoaero.nativebase/files/session-diagnostic.png "${{ runner.temp }}/duoaero-evidence/session-$probe_label.png" || true
            adb pull /sdcard/Android/data/com.duoaero.nativebase/files/session-view-tree.json "${{ runner.temp }}/duoaero-evidence/views-$probe_label.json" || true
            if [ "$probe_interact" != none ]; then
              for phase in selected submitted continued; do
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/interaction-$phase.$extension" "${{ runner.temp }}/duoaero-evidence/interaction-$probe_label-$phase.$extension" || true
                done
              done
            fi
            if [ "$probe_home" = true ]; then
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/home-diagnostic.png "${{ runner.temp }}/duoaero-evidence/home-$probe_label.png" || true
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/home-view-tree.json "${{ runner.temp }}/duoaero-evidence/home-$probe_label.json" || true
              if [ "$probe_config" = native-default ]; then
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/home-before-config.$extension" "${{ runner.temp }}/duoaero-evidence/home-before-config.$extension" || true
                done
              fi
            fi
            if [[ "$probe_interact" = math-all || "$probe_interact" = math-hint || "$probe_interact" = path-first ]]; then
              if [ "$probe_interact" = path-first ]; then
                for phase in topic-headers node-opened session; do
                  for extension in png json; do
                    adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/path-$phase.$extension" "${{ runner.temp }}/duoaero-evidence/path-$phase.$extension" || true
                  done
                done
              fi
              for phase in $(seq 0 19) $(printf 'prompt-%s ' $(seq 0 19)) prompt-scrolled hint-open hint-graded hint-retry hint-TA1-0078-D2 hint-TA1-0132-D2 hint-TA1-0154-D2 hint-TA1-0081-D2 after-last-answer after-end-observation after-claim-xp; do
                case "$phase" in
                  after-*|prompt-*|hint-*) probe_file="lesson-$phase" ;;
                  *) probe_file="lesson-answer-$phase" ;;
                esac
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/$probe_file.$extension" "${{ runner.temp }}/duoaero-evidence/$probe_file.$extension" || true
                done
              done
            fi
            if [[ "$probe_interact" = formula* ]]; then
              for phase in prompt selected graded; do
                for item in $(seq 0 23); do
                  for extension in png json; do
                    adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/formula-$phase-$item.$extension" "${{ runner.temp }}/duoaero-evidence/$probe_label-$phase-$item.$extension" || true
                  done
                done
              done
            fi
            if [[ "$probe_interact" = mixed* ]]; then
              for phase in prompt selected graded; do
                for item in $(seq 0 19); do
                  for extension in png json; do
                    adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/mixed-$phase-$item.$extension" "${{ runner.temp }}/duoaero-evidence/mixed-$phase-$item.$extension" || true
                  done
                done
              done
              for phase in hint hinted-feedback retry; do
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/mixed-mach-$phase.$extension" "${{ runner.temp }}/duoaero-evidence/mixed-mach-$phase.$extension" || true
                done
              done
            fi
            adb logcat -d -s DuoAeroProbe:I DuoAeroNative:I AndroidRuntime:E chromium:E > "${{ runner.temp }}/duoaero-evidence/probe-$probe_label.txt"
            adb logcat -d -s Rive:D rive:D RiveRenderer:D OpenGLRenderer:W libEGL:W > "${{ runner.temp }}/duoaero-evidence/render-$probe_label.txt"
            adb shell dumpsys power > "${{ runner.temp }}/duoaero-evidence/power-$probe_label.txt"
            adb shell dumpsys activity lastanr > "${{ runner.temp }}/duoaero-evidence/anr-$probe_label.txt"
            if [ "$probe_interact" = path-first ]; then
              for phase in node-opened session; do
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/path-$phase.$extension" "${{ runner.temp }}/duoaero-evidence/path-$phase.$extension" || true
                done
              done
            fi
            adb logcat -d -b crash > "${{ runner.temp }}/duoaero-evidence/crash-$probe_label.txt"
            cat "${{ runner.temp }}/duoaero-evidence/session-$probe_label.txt"
            if [ "$probe_status" != 0 ]; then adb shell am force-stop com.duoaero.nativebase; fi
          }
          case "$DIAGNOSTIC_SCENARIO" in
            google)
              timeout 300 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.GoogleGateProbe > ${{ runner.temp }}/duoaero-evidence/google.txt
              adb shell am force-stop com.duoaero.nativebase
              timeout 150 adb shell am instrument -w -e restart true com.duoaero.nativebase.tests/com.duoaero.nativebase.GoogleGateProbe > ${{ runner.temp }}/duoaero-evidence/google-restart.txt
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/ ${{ runner.temp }}/duoaero-evidence/google-files || true
              adb logcat -d -s AndroidRuntime:E DuoAeroNative:I chromium:E > ${{ runner.temp }}/duoaero-evidence/google-logcat.txt
              python -c "from pathlib import Path; assert 'GOOGLE_GATE_VERIFIED=true' in Path('${{ runner.temp }}/duoaero-evidence/google.txt').read_text(); assert 'GOOGLE_STORAGE_RESTART_VERIFIED=true' in Path('${{ runner.temp }}/duoaero-evidence/google-restart.txt').read_text()"
              ;;
            atmosphere)
              python native-base/test_atmosphere.py
              ;;
            atmosphere-hint)
              export DUOAERO_TEST_FORMULA_HINT=1
              export DUOAERO_CAPTURE_COMPLETION=1
              python native-base/test_atmosphere.py
              ;;
            atmosphere-timing)
              python native-base/test_atmosphere.py
              test -s "${{ runner.temp }}/duoaero-evidence/atmosphere-latency.txt"
              ;;
            sections)
              python native-base/test_sections.py
              ;;
            two-sections)
              python native-base/test_two_sections.py
              ;;
            static-poses-only)
              timeout 120 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.StaticMascotProbe > "${{ runner.temp }}/duoaero-evidence/static-mascot.txt"
              grep -q 'STATIC_MOODS_VERIFIED=true' "${{ runner.temp }}/duoaero-evidence/static-mascot.txt"
              grep -q 'WAVE_FRAMES_CHANGED=true' "${{ runner.temp }}/duoaero-evidence/static-mascot.txt"
              grep -q 'WAVE_LAYOUT_INFLATED=true' "${{ runner.temp }}/duoaero-evidence/static-mascot.txt"
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/static-mascot-poses.png "${{ runner.temp }}/duoaero-evidence/static-mascot-poses.png"
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/wave-frame-0.png "${{ runner.temp }}/duoaero-evidence/wave-frame-0.png"
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/wave-frame-1.png "${{ runner.temp }}/duoaero-evidence/wave-frame-1.png"
              ;;
            static-mascot)
              timeout 120 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.StaticMascotProbe > "${{ runner.temp }}/duoaero-evidence/static-mascot.txt"
              grep -q 'STATIC_MOODS_VERIFIED=true' "${{ runner.temp }}/duoaero-evidence/static-mascot.txt"
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/static-mascot-poses.png "${{ runner.temp }}/duoaero-evidence/static-mascot-poses.png"
              run_probe static-quit MATH_BT native-defaults late native-full aerospace-mixed quit-preview false native-default native-cache true
              grep -q 'STATIC_QUIT_SCREEN_VERIFIED=true' "${{ runner.temp }}/duoaero-evidence/session-static-quit.txt"
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/static-quit-dialog.png "${{ runner.temp }}/duoaero-evidence/static-quit-dialog.png"
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/static-quit-dialog.json "${{ runner.temp }}/duoaero-evidence/static-quit-dialog.json"
              ;;
            chests)
              python native-base/test_chests.py
              ;;
            chests-native)
              export DUOAERO_REQUIRE_NATIVE_CHEST=1
              python native-base/test_chests.py
              ;;
            accounts)
              timeout 120 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.AccountProgressProbe > ${{ runner.temp }}/duoaero-evidence/accounts.txt
              python -c "from pathlib import Path; assert 'ACCOUNT_STORAGE_VERIFIED=true' in Path('${{ runner.temp }}/duoaero-evidence/accounts.txt').read_text()"
              ;;
            updater)
              timeout 180 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.UpdaterProbe > ${{ runner.temp }}/duoaero-evidence/updater.txt
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/launcher-icon.png ${{ runner.temp }}/duoaero-evidence/ || true
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/profile-observation.png ${{ runner.temp }}/duoaero-evidence/ || true
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/profile-observation.json ${{ runner.temp }}/duoaero-evidence/ || true
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/updater-settings.png ${{ runner.temp }}/duoaero-evidence/ || true
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/updater-settings.json ${{ runner.temp }}/duoaero-evidence/ || true
              adb logcat -d -s AndroidRuntime:E DuoAeroNative:I chromium:E > ${{ runner.temp }}/duoaero-evidence/updater-logcat.txt
              python -c "from pathlib import Path; assert 'UPDATER_HOST_VERIFIED=true' in Path('${{ runner.temp }}/duoaero-evidence/updater.txt').read_text()"
              ;;
            mixed|gap-s24)
              run_probe aerospace-mixed MATH_BT native-defaults late native-full aerospace-mixed mixed false native-default native-cache true
              if [ "$DIAGNOSTIC_SCENARIO" = mixed ]; then python native-base/test_match_layout.py; fi
              python native-base/test_gap_alignment.py
              ;;
            wind-mixed)
              run_probe aerospace-wind-mixed MATH_BT native-defaults late native-full aerospace-mixed mixed false native-default native-cache true
              ;;
            formula-words-touch)
              run_probe aerospace-words-touch MATH_BT native-defaults late native-full aerospace-mixed mixed-touch false native-default native-cache true
              grep -q 'All 13 mixed source exercises produced original visible correct feedback' "${{ runner.temp }}/duoaero-evidence/session-aerospace-words-touch.txt"
              ;;
            isa-mixed)
              run_probe aerospace-isa-mixed MATH_BT native-defaults late native-full aerospace-mixed mixed-touch false native-default native-cache true
              grep -q 'All 5 mixed source exercises produced original visible correct feedback' "${{ runner.temp }}/duoaero-evidence/session-aerospace-isa-mixed.txt"
              ;;
            spacecraft-mixed)
              run_probe aerospace-spacecraft MATH_BT native-defaults late native-full aerospace-mixed mixed-touch false native-default native-cache true
              grep -q 'All 10 mixed source exercises produced original visible correct feedback' "${{ runner.temp }}/duoaero-evidence/session-aerospace-spacecraft.txt"
              ;;
            wind-mixed-hint)
              run_probe aerospace-wind-hint MATH_BT native-defaults late native-full aerospace-mixed mixed-hint false native-default native-cache true
              grep -q 'PASS: native wind formula practice preceded each calculation' "${{ runner.temp }}/duoaero-evidence/session-aerospace-wind-hint.txt"
              ;;
            mixed-hint)
              run_probe aerospace-mixed-hint MATH_BT native-defaults late native-full aerospace-mixed mixed-hint false native-default native-cache true
              grep -q 'PASS: native Mach formula practice preceded each calculation' "${{ runner.temp }}/duoaero-evidence/session-aerospace-mixed-hint.txt"
              ;;
            standalone|s24|resume|mistakes|review)
              if [ "$DIAGNOSTIC_SCENARIO" = resume ]; then export DUOAERO_TEST_RESUME=1; fi
              if [ "$DIAGNOSTIC_SCENARIO" = mistakes ]; then export DUOAERO_TEST_MISTAKES=1; fi
              if [ "$DIAGNOSTIC_SCENARIO" = review ]; then export DUOAERO_TEST_REVIEW=1; fi
              python native-base/test_standalone.py
              if [ "$DIAGNOSTIC_SCENARIO" = s24 ]; then
                adb shell dumpsys activity activities > "$DUOAERO_EVIDENCE/s24-activities.txt"
                python native-base/test_tall_window.py
              fi
              ;;
            path)
              run_probe aerospace-path-session MATH_BT native-defaults late native-full aerospace-rich path-first true native-default native-cache true
              ;;
            night-large)
              adb shell cmd uimode night yes
              adb shell settings put system font_scale 1.3
              adb shell am force-stop com.duoaero.nativebase
              run_probe aerospace-night-large MATH_BT native-defaults late native-full aerospace-rich math-all false native-default native-cache true
              adb shell dumpsys vibrator_manager > ${{ runner.temp }}/duoaero-evidence/vibration-observation.txt
              adb shell dumpsys audio > ${{ runner.temp }}/duoaero-evidence/audio-observation.txt
              adb shell dumpsys uimode > ${{ runner.temp }}/duoaero-evidence/night-observation.txt
              python native-base/test_device_effects.py
              ;;
          hint)
            run_probe aerospace-rich-hint MATH_BT native-defaults late native-full aerospace-rich math-hint false native-default native-cache true
            ;;
          lesson)
              run_probe aerospace-rich-all MATH_BT native-defaults late native-full aerospace-rich math-all false native-default native-cache true
              run_probe aerospace-rich-wrong MATH_BT native-defaults late native-full aerospace-rich math-wrong false native-default native-cache true
              ;;
            formula)
              run_probe aerospace-formula MATH_BT native-defaults late native-full aerospace-formula formula false native-default native-cache true
              python native-base/test_formula_spacing.py
              run_probe aerospace-formula-wrong MATH_BT native-defaults late native-full aerospace-formula formula-wrong false native-default native-cache true
              ;;
          esac
          python - <<'PYTHON'
          from pathlib import Path
          assert '1200 passed, 0 failed' in Path('${{ runner.temp }}/duoaero-evidence/models.txt').read_text()
          for path in Path('${{ runner.temp }}/duoaero-evidence').glob('session-*.txt'):
              assert 'DIAGNOSTIC_COLLECTION_COMPLETED=true' in path.read_text(), path.name
          PYTHON
          echo 'Diagnostic collection only. This does not establish a playable lesson or authorize release.' > ${{ runner.temp }}/duoaero-evidence/NOT-A-RELEASE.txt
      - name: Preserve emulator ANR thread traces
        if: always()
        timeout-minutes: 2
        run: |
          if command -v adb >/dev/null && adb get-state >/dev/null 2>&1; then
            adb logcat -d -b all > "${{ runner.temp }}/duoaero-evidence/device-log.txt"
            adb root || true
            timeout 20 adb wait-for-device || true
            adb pull /data/anr "${{ runner.temp }}/duoaero-evidence/anr-traces" || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-runtime-diagnostic-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/duoaero-evidence/
            ${{ runner.temp }}/duoaero-native-base/*-test.apk
            ${{ runner.temp }}/duoaero-native-base/tests-signed.apk
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-runtime-evidence-${{ matrix.scenario }}
          path: ${{ runner.temp }}/duoaero-evidence/
          retention-days: 7
