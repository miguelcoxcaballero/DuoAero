name: Original runtime diagnostic
on:
  push:
    branches: [codex/original-runtime-integration]
    paths: ['native-base/**', '.github/workflows/native-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [path, lesson, formula, mixed, standalone, resume, mistakes]
    timeout-minutes: 30
    env:
      ANDROID_HOME: /tmp/duoaero-sdk
      ANDROID_USER_HOME: /tmp/duoaero-android
      ANDROID_AVD_HOME: /tmp/duoaero-android/avd
      DUOAERO_APK: /tmp/duoaero-handoff/Duolingo_v6.103.5.apk
      DUOAERO_DECODED: /tmp/duoaero-decoded
      DUOAERO_SMALI: /tmp/duoaero-decoded
      DUOAERO_APKTOOL: /tmp/apktool.jar
      DUOAERO_WORK: /tmp/duoaero-native-base
      DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare original APK and local diagnostic signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This job installs its pinned SDK under /tmp. Remove only the
          # duplicate hosted-runner Android SDK to leave room for the emulator.
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ] && [ -d /usr/local/lib/android/sdk ]; then
            sudo rm -rf /usr/local/lib/android/sdk
          fi
          df -h /tmp
          mkdir -p /tmp/duoaero-handoff build /tmp/duoaero-evidence
          gh release download handoff-2026-10-31-native-runtime-1 --repo "$GITHUB_REPOSITORY" --dir /tmp/duoaero-handoff
          python - <<'PY'
          import json, hashlib, pathlib, zipfile
          for a in json.load(open('native-base/handoff-artifacts.json'))['artifacts']:
              p=pathlib.Path('/tmp/duoaero-handoff')/a['name']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256'], p.name
          with zipfile.ZipFile('/tmp/duoaero-handoff/DuoAero-handoff-fixtures.zip') as z:
              for name in z.namelist():
                  if name.startswith('native-base/tests/fixtures/'):
                      z.extract(name,'.')
          PY
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o "$DUOAERO_APKTOOL"
          java -jar "$DUOAERO_APKTOOL" d "$DUOAERO_APK" -o "$DUOAERO_SMALI"
          python -m pip install fonttools==4.61.1
          keytool -genkeypair -keystore build/debug.p12 -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -dname 'CN=DuoAero CI Diagnostic' -keyalg RSA -validity 365
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools'  'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
      - name: Build diagnostic APKs, preserving original runtime
        run: |
          python native-base/course_adapter.py
          case "$DIAGNOSTIC_SCENARIO" in standalone|resume|mistakes) export DUOAERO_STANDALONE=1;; esac
          python native-base/build.py
          python native-base/test_symbolic_grading.py
          python native-base/test_course_progress.py
          python native-base/test_integrity.py | tee /tmp/duoaero-evidence/integrity.txt
          python native-base/test_models.py --build-only
      - name: Observe original session dependencies
        timeout-minutes: 16
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name DuoAeroDiagnostic --path "$ANDROID_AVD_HOME/DuoAeroDiagnostic.avd" --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd DuoAeroDiagnostic -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -accel on > /tmp/duoaero-evidence/emulator.txt 2>&1 &
          emulator_pid=$!
          ready=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat /tmp/duoaero-evidence/emulator.txt; exit 1; fi
            if [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/duoaero-evidence/emulator.txt; exit 1; fi
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 3600000
          adb shell input keyevent KEYCODE_WAKEUP
          timeout 180 adb install --no-incremental -r "$DUOAERO_WORK/DuoAero-native-base-test.apk"
          timeout 180 adb install --no-incremental -r "$DUOAERO_WORK/tests-signed.apk"
          timeout 180 adb shell am instrument -w com.duoaero.nativebase.tests/com.duoaero.nativebase.ModelProbe > /tmp/duoaero-evidence/models.txt
          adb logcat -d -b crash > /tmp/duoaero-evidence/models-crash.txt
          adb logcat -d -s AndroidRuntime:E DEBUG:F libc:F ActivityManager:I > /tmp/duoaero-evidence/models-lifecycle.txt
          run_probe() {
            probe_label="$1"
            probe_course="$2"
            probe_experiments="$3"
            probe_bootstrap="${4:-late}"
            probe_course_cache="${5:-none}"
            probe_lesson="${6:-math}"
            probe_interact="${7:-none}"
            probe_home="${8:-false}"
            probe_config="${9:-none}"
            probe_profile="${10:-diagnostic-flows}"
            probe_service="${11:-false}"
            probe_timeout=180
            if [[ "$probe_interact" = math-all || "$probe_interact" = path-first ]]; then probe_timeout=300; fi
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/session-diagnostic.png /sdcard/Android/data/com.duoaero.nativebase/files/session-view-tree.json
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/interaction-*.png /sdcard/Android/data/com.duoaero.nativebase/files/interaction-*.json
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/home-diagnostic.png /sdcard/Android/data/com.duoaero.nativebase/files/home-view-tree.json /sdcard/Android/data/com.duoaero.nativebase/files/home-before-config.png /sdcard/Android/data/com.duoaero.nativebase/files/home-before-config.json
            adb shell rm -f /sdcard/Android/data/com.duoaero.nativebase/files/lesson-*.png /sdcard/Android/data/com.duoaero.nativebase/files/lesson-*.json
            probe_status=0
            timeout "$probe_timeout" adb shell am instrument -w -e course_id "$probe_course" -e experiments "$probe_experiments" -e bootstrap "$probe_bootstrap" -e course_cache "$probe_course_cache" -e lesson "$probe_lesson" -e interact "$probe_interact" -e capture_home "$probe_home" -e config_cache "$probe_config" -e profile_mode "$probe_profile" -e local_service "$probe_service" com.duoaero.nativebase.tests/com.duoaero.nativebase.UserSessionProbe > "/tmp/duoaero-evidence/session-$probe_label.txt" || probe_status=$?
            echo "Instrumentation command exit: $probe_status" >> "/tmp/duoaero-evidence/session-$probe_label.txt"
            adb pull /sdcard/Android/data/com.duoaero.nativebase/files/session-diagnostic.png "/tmp/duoaero-evidence/session-$probe_label.png" || true
            adb pull /sdcard/Android/data/com.duoaero.nativebase/files/session-view-tree.json "/tmp/duoaero-evidence/views-$probe_label.json" || true
            if [ "$probe_interact" != none ]; then
              for phase in selected submitted continued; do
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/interaction-$phase.$extension" "/tmp/duoaero-evidence/interaction-$probe_label-$phase.$extension" || true
                done
              done
            fi
            if [ "$probe_home" = true ]; then
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/home-diagnostic.png "/tmp/duoaero-evidence/home-$probe_label.png" || true
              adb pull /sdcard/Android/data/com.duoaero.nativebase/files/home-view-tree.json "/tmp/duoaero-evidence/home-$probe_label.json" || true
              if [ "$probe_config" = native-default ]; then
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/home-before-config.$extension" "/tmp/duoaero-evidence/home-before-config.$extension" || true
                done
              fi
            fi
            if [[ "$probe_interact" = math-all || "$probe_interact" = path-first ]]; then
              for phase in $(seq 0 19) prompt-1 prompt-2 prompt-3 prompt-scrolled after-last-answer after-end-observation after-claim-xp; do
                case "$phase" in
                  after-*|prompt-*) probe_file="lesson-$phase" ;;
                  *) probe_file="lesson-answer-$phase" ;;
                esac
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/$probe_file.$extension" "/tmp/duoaero-evidence/$probe_file.$extension" || true
                done
              done
            fi
            if [[ "$probe_interact" = formula* ]]; then
              for phase in prompt selected graded; do
                for item in 0 1; do
                  for extension in png json; do
                    adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/formula-$phase-$item.$extension" "/tmp/duoaero-evidence/$probe_label-$phase-$item.$extension" || true
                  done
                done
              done
            fi
            if [ "$probe_interact" = mixed ]; then
              for phase in prompt selected graded; do
                for item in $(seq 0 7); do
                  for extension in png json; do
                    adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/mixed-$phase-$item.$extension" "/tmp/duoaero-evidence/mixed-$phase-$item.$extension" || true
                  done
                done
              done
            fi
            adb logcat -d -s DuoAeroProbe:I DuoAeroNative:I AndroidRuntime:E chromium:E > "/tmp/duoaero-evidence/probe-$probe_label.txt"
            adb logcat -d -s Rive:D rive:D RiveRenderer:D OpenGLRenderer:W libEGL:W > "/tmp/duoaero-evidence/render-$probe_label.txt"
            adb shell dumpsys power > "/tmp/duoaero-evidence/power-$probe_label.txt"
            adb shell dumpsys activity lastanr > "/tmp/duoaero-evidence/anr-$probe_label.txt"
            if [ "$probe_interact" = path-first ]; then
              for phase in node-opened session; do
                for extension in png json; do
                  adb pull "/sdcard/Android/data/com.duoaero.nativebase/files/path-$phase.$extension" "/tmp/duoaero-evidence/path-$phase.$extension" || true
                done
              done
            fi
            adb logcat -d -b crash > "/tmp/duoaero-evidence/crash-$probe_label.txt"
            cat "/tmp/duoaero-evidence/session-$probe_label.txt"
            if [ "$probe_status" != 0 ]; then adb shell am force-stop com.duoaero.nativebase; fi
          }
          case "$DIAGNOSTIC_SCENARIO" in
            mixed)
              run_probe aerospace-mixed MATH_BT native-defaults late native-full aerospace-mixed mixed false native-default native-cache true
              ;;
            standalone|resume|mistakes)
              if [ "$DIAGNOSTIC_SCENARIO" = resume ]; then export DUOAERO_TEST_RESUME=1; fi
              if [ "$DIAGNOSTIC_SCENARIO" = mistakes ]; then export DUOAERO_TEST_MISTAKES=1; fi
              python native-base/test_standalone.py
              ;;
            path)
              run_probe aerospace-path-session MATH_BT native-defaults late native-full aerospace-rich path-first true native-default native-cache true
              ;;
            lesson)
              run_probe aerospace-rich-all MATH_BT native-defaults late native-full aerospace-rich math-all false native-default native-cache true
              run_probe aerospace-rich-wrong MATH_BT native-defaults late native-full aerospace-rich math-wrong false native-default native-cache true
              ;;
            formula)
              run_probe aerospace-formula MATH_BT native-defaults late native-full aerospace-formula formula false native-default native-cache true
              run_probe aerospace-formula-wrong MATH_BT native-defaults late native-full aerospace-formula formula-wrong false native-default native-cache true
              ;;
          esac
          python - <<'PYTHON'
          from pathlib import Path
          assert '1200 passed, 0 failed' in Path('/tmp/duoaero-evidence/models.txt').read_text()
          for path in Path('/tmp/duoaero-evidence').glob('session-*.txt'):
              assert 'DIAGNOSTIC_COLLECTION_COMPLETED=true' in path.read_text(), path.name
          PYTHON
          echo 'Diagnostic collection only. This does not establish a playable lesson or authorize release.' > /tmp/duoaero-evidence/NOT-A-RELEASE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-runtime-diagnostic-${{ matrix.scenario }}
          path: |
            /tmp/duoaero-evidence/
            /tmp/duoaero-native-base/*-test.apk
            /tmp/duoaero-native-base/tests-signed.apk
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-runtime-evidence-${{ matrix.scenario }}
          path: /tmp/duoaero-evidence/
          retention-days: 7
