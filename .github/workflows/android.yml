name: Validate course and shared integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate course
        run: |
          python3 tests/validate_bank.py
          python3 native-base/test_kinetic_steps.py
          python3 native-base/test_payload_steps.py
          python3 native-base/test_reynolds_steps.py
          python3 native-base/test_simple_calculation_hints.py
          python3 native-base/test_rich_question.py
      - name: Check account and Drive boundaries
        run: node --test tests/auth.test.cjs tests/native-auth-storage.test.cjs
      - name: Verify frozen updater sources
        run: python3 vendor/inhouse-services-updater/verify.py
      # Android builds and device tests use native-diagnostic.yml. The retired
      # custom-controller builder is not the requested original-runtime app.
