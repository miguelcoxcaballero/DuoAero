name: Validate course and shared integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate course
        run: |
          python3 tests/validate_bank.py
          python3 research/test_taper_domain.py
          python3 research/test_taper_prerequisites.py
          python3 research/test_taper_stages.py
          python3 research/test_taper_distribution.py
          python3 research/test_wide_fraction_fixture.py
          python3 research/test_wind_budget_steps.py
          python3 research/test_wind_budget_prerequisites.py
          python3 native-base/test_kinetic_steps.py
          python3 native-base/test_payload_steps.py
          python3 native-base/test_reynolds_steps.py
          python3 native-base/test_spar_steps.py
          python3 research/test_breguet_ratio_steps.py
          python3 research/test_breguet_ratio_prerequisites.py
          python3 research/test_approach_speed_steps.py
          python3 research/test_approach_prerequisites.py
          python3 research/test_tsfc_conversion_draft.py
          python3 research/test_speed_limits_steps.py
          python3 research/test_speed_limits_lesson.py
          python3 research/test_space_environment_extra.py
          python3 research/test_spacecraft_extra.py
          python3 research/test_rotorcraft_extra.py
          python3 research/test_diverse_aircraft_extra.py
          python3 native-base/test_simple_calculation_hints.py
          python3 native-base/test_rich_question.py
          python3 native-base/test_updater_dependency_fetch.py
      - name: Check account and Drive boundaries
        run: node --test tests/auth.test.cjs tests/native-auth-storage.test.cjs
      - name: Verify frozen updater sources
        run: python3 vendor/inhouse-services-updater/verify.py
      # Android builds and device tests use native-diagnostic.yml. The retired
      # custom-controller builder is not the requested original-runtime app.
