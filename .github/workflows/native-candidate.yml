name: Build original runtime production candidate
on:
  workflow_dispatch:
  push:
    branches: [codex/original-runtime-integration]
    paths: ['.github/workflows/native-candidate.yml', '.github/native-candidate-request.json']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure production identity and build directories
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "DUOAERO_APK=$RUNNER_TEMP/duoaero-handoff/Duolingo_v6.103.5.apk" >> "$GITHUB_ENV"
          echo "DUOAERO_DECODED=$RUNNER_TEMP/duoaero-decoded" >> "$GITHUB_ENV"
          echo "DUOAERO_SMALI=$RUNNER_TEMP/duoaero-decoded" >> "$GITHUB_ENV"
          echo "DUOAERO_APKTOOL=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"
          echo "DUOAERO_WORK=$RUNNER_TEMP/duoaero-production" >> "$GITHUB_ENV"
          echo 'DUOAERO_PACKAGE=com.duoaero' >> "$GITHUB_ENV"
          echo 'DUOAERO_VERSION=1.3.1' >> "$GITHUB_ENV"
          echo 'DUOAERO_VERSION_CODE=10301' >> "$GITHUB_ENV"
      - name: Verify and decode original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/duoaero-handoff"
          gh release download handoff-2026-10-31-native-runtime-1 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/duoaero-handoff"
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'duoaero-handoff'
          for item in json.load(open('native-base/handoff-artifacts.json'))['artifacts']:
              assert hashlib.sha256((folder/item['name']).read_bytes()).hexdigest()==item['sha256']
          with zipfile.ZipFile(folder/'DuoAero-handoff-fixtures.zip') as archive:
              for name in archive.namelist():
                  if name.startswith('native-base/tests/fixtures/'):
                      archive.extract(name,'.')
          PY
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -o "$DUOAERO_APKTOOL"
          java -Xmx3g -jar "$DUOAERO_APKTOOL" d "$DUOAERO_APK" -o "$DUOAERO_SMALI"
          python -m pip install fonttools==4.61.1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build unsigned candidate and bind its source inventory
        run: |
          python tests/validate_bank.py
          node --test tests/auth.test.cjs tests/native-auth-storage.test.cjs
          python native-base/course_adapter.py
          python native-base/build.py
          export DUOAERO_VERIFY_APK="$DUOAERO_WORK/DuoAero-1.3.1-unsigned.apk"
          python native-base/test_integrity.py
          python native-base/prepare_release.py --apk "$DUOAERO_VERIFY_APK" --version 1.3.1 --code 10301
          mkdir -p dist/native-candidate
          cp "$DUOAERO_VERIFY_APK" release-input.json dist/native-candidate/
          python - <<'PY'
          import json, os, pathlib
          info={'sourceSha':os.environ['GITHUB_SHA'],'buildRun':os.environ['GITHUB_RUN_ID'],
                'signed':False,'releaseReady':False,
                'notice':'Unsigned candidate. Build and integrity checks do not establish device acceptance.'}
          pathlib.Path('dist/native-candidate/build-info.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-production-candidate
          path: dist/native-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
