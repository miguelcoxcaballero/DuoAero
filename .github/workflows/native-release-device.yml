name: Verify published production APK on Android
on:
  push:
    branches: [codex/original-runtime-integration, main]
    paths: ['.github/native-smoke-request.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download exact signed releases
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          r=json.loads(Path('.github/native-smoke-request.json').read_text())
          assert r['version']=='1.3.0' and r['versionCode']==10300
          for version,target,digest in [('1.2.0','old.apk','71721ab3471cfa129065fd81d32289c2cf3921afabce9828e54115a6595ad9d6'),('1.3.0','new.apk',r['apkSha256'])]:
              urllib.request.urlretrieve(f'https://github.com/miguelcoxcaballero/DuoAero/releases/download/v{version}/DuoAero-{version}.apk',target)
              assert hashlib.sha256(Path(target).read_bytes()).hexdigest()==digest
          PY
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in old.apk new.apk; do
            "$tools/apksigner" verify --print-certs "$apk" > "$apk.certs"
            test "$(grep -o 'certificate SHA-256 digest: [0-9a-f]*' "$apk.certs" | awk '{print $4}' | sort -u)" = 7133a4b3e4b9f9c4d2fbbd38b7dd2d44c7b8d0d7d16568bfe3da74a09e7887b6
          done
      - name: Prepare Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then sudo rm -rf "$ANDROID_HOME/ndk"; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name Production --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
      - name: Install and launch production bytes
        run: |
          mkdir -p evidence
          "$ANDROID_HOME/emulator/emulator" -avd Production -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -accel on > evidence/emulator.txt 2>&1 &
          emulator_pid=$!
          ready=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat evidence/emulator.txt; exit 1; fi
            if [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 3600000
          adb shell input keyevent KEYCODE_WAKEUP
          python .github/scripts/native-release-smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-apk-device-evidence
          path: evidence/
          retention-days: 14
