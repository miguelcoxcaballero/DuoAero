name: Publish verified native APK artifact
on:
  push:
    branches: [codex/original-runtime-integration, main]
    paths: ['.github/native-publish-request.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: duoaero-native-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate pinned artifact request
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          r=json.loads(Path('.github/native-publish-request.json').read_text())
          assert r['mode'] in ('unsigned','signed')
          assert r['version']=='1.3.7' and r['versionCode']==10307
          assert isinstance(r['artifactId'],int) and r['artifactId']>0
          assert re.fullmatch('[0-9a-f]{40}',r['sourceSha'])
          assert re.fullmatch('[0-9a-f]{64}',r['apkSha256'])
          owner='miguelcoxcaballero/'
          repo=owner+('DuoAero' if r['mode']=='unsigned' else 'youtube-calma')
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('ARTIFACT_REPOSITORY='+repo+'\n')
              output.write('ARTIFACT_ID='+str(r['artifactId'])+'\n')
          PY
      - name: Download and verify artifact identity
        run: |
          gh api "repos/$ARTIFACT_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          r=json.loads(Path('.github/native-publish-request.json').read_text())
          unsigned=r['mode']=='unsigned'
          filename='DuoAero-1.3.7'+('-unsigned' if unsigned else '')+'.apk'
          allowed={filename,filename+'.idsig','build-info.json','release-input.json','SHA256SUMS.txt'}
          with zipfile.ZipFile('artifact.zip') as archive:
              assert set(archive.namelist())<=allowed,archive.namelist()
              archive.extractall('publication')
          folder=Path('publication');info=json.loads((folder/'build-info.json').read_text())
          assert info['sourceSha' if unsigned else 'sha']==r['sourceSha']
          apk=folder/filename
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==r['apkSha256']
          if unsigned:
              receipt=json.loads((folder/'release-input.json').read_text())
              assert receipt['sha256']==r['apkSha256'] and receipt['implementation']=='native-base'
              tag='build-1.3.7'
              title='Unsigned original-runtime candidate 1.3.7'
              notes='Unsigned build input for the permanent signer. This is not an installable app or a completed release.\n'
          else:
              assert info['version']=='1.3.7' and info['versionCode']==10307
              assert info['apkSha256']==r['apkSha256']
              assert info['signerSha256']=='7133a4b3e4b9f9c4d2fbbd38b7dd2d44c7b8d0d7d16568bfe3da74a09e7887b6'
              tag='v1.3.7'
              title='DuoAero 1.3.7 original runtime'
              notes=Path('.github/native-release-notes.md').read_text()
          Path('publication-notes.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for key,value in {'APK':str(apk),'MODE':r['mode'],'TAG':tag,'TITLE':title,'SOURCE_SHA':r['sourceSha']}.items():
                  output.write(key+'='+value+'\n')
          PY
      - name: Verify Android package and permanent certificate
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/aapt2" dump badging "$APK" > publication-badging.txt
          grep -q "package: name='com.duoaero' versionCode='10307' versionName='1.3.7'" publication-badging.txt
          ! grep -q application-debuggable publication-badging.txt
          if [ "$MODE" = signed ]; then
            "$tools/apksigner" verify --print-certs "$APK" > publication-signers.txt
            signers=$(grep -o 'certificate SHA-256 digest: [0-9a-f]*' publication-signers.txt | awk '{print $4}' | sort -u)
            test "$signers" = 7133a4b3e4b9f9c4d2fbbd38b7dd2d44c7b8d0d7d16568bfe3da74a09e7887b6
          fi
      - name: Publish exact bytes without replacing an existing release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The authenticated publisher creates the release when this token
            # cannot. Retries accept only identical immutable assets.
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
            python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];tag=os.environ['TAG']
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/{tag}']))
          assets={item['name']:item for item in release['assets']}
          files={path.name:path for path in Path('publication').iterdir() if path.is_file()}
          assert set(assets)<=set(files),'Unexpected published asset; refusing to change release'
          for name,path in files.items():
              digest='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
              if name in assets:
                  assert assets[name].get('digest')==digest and assets[name]['size']==path.stat().st_size,name
                  print('Identical published asset retained:',name)
              else:
                  subprocess.run(['gh','release','upload',tag,'--repo',repo,str(path)],check=True)
          PY
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "$TITLE" --notes-file publication-notes.md publication/*
          fi
